name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://app:app-dev-only@localhost:55432/analyst
      TEST_WAREHOUSE_URL: postgres://analyst_ro:warehouse-dev-only@localhost:55432/analyst
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start the database
        run: docker compose up -d --wait db
      - run: go vet ./...
      - run: go test ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Start the stack
        run: docker compose up -d --build --wait db api web
      - run: node e2e/run.mjs
      - name: Logs on failure
        if: failure()
        run: docker compose logs api
