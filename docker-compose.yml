name: ai-data-analyst

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app-dev-only}
      POSTGRES_DB: analyst
      WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD:-warehouse-dev-only}
    volumes:
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d analyst"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
